[package]
name = "dinov3-hrx"
version = "0.2.1"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
description = "DINOv3 ViT family inference in Rust for AMD GPUs with HRX and Loom"
repository = "https://github.com/zacharydenton/dinov3-hrx"
include = ["src/**", "kernels/**", "tests/**", "examples/**", "docs/**", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]

[dependencies]
hrx = { package = "hrx-rs", version = "0.8.7" }
anyhow = "1"
half = { version = "2", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["min_const_generics"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
matrixmultiply = "0.3"
safetensors = "0.8"
libm = "0.2"
